name: CI (musl)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (x86_64 musl)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test in Alpine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs/musl
          docker run --rm \
            --env CI_UID="$(id -u)" --env CI_GID="$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            alpine:edge /bin/sh .github/workflows/scripts/build-musl.sh \
            2>&1 | tee ci-logs/musl/build.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-x86_64-musl
          path: |
            ci-logs/musl/
            build-musl/meson-logs/
          if-no-files-found: ignore
          retention-days: 7
