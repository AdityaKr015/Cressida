name: Bug report
description: Report a Cressida bug or regression.
title: "[BUG] "
labels: [bug]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed tokens, private messages and other sensitive data from this report.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Describe the problem and whether it is a regression.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cressida version
      description: Release version or development revision, and when you last updated.
      placeholder: "0.1.0, source build updated 2026-10-19"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment information
      description: Include your distribution, installation method and, for visual/input issues, compositor, GPU/driver and interface scale.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: |
        Include terminal output around the failure, not only "Segmentation fault".
        For crashes, `just debug` or `just run asan` can provide a useful trace.
        Remove credentials, private messages and account identifiers before sharing.
        Do not upload token files, account state or core dumps.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Screenshots and additional context
      description: Redact private conversations and identifying details from screenshots.
